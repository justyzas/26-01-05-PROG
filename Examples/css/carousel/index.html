<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<title>Pure CSS Carousel (Fixed)</title>

		<style>
			* {
				font-family: Arial, sans-serif;
			}

			body {
				margin: 40px;
				background: #f4f4f4;
			}

			/* CAROUSEL */
			.carousel {
				max-width: 1400px;
				height: 400px;
				/* padaro kad turinys nesimatytų už karuselės ribų */
				overflow: hidden;
				border-radius: 12px;
				position: relative;
			}

			/* SLIDE TRACK */
			.carousel .slides {
				display: flex;
				/* 100% tėvinio elemento atitikimas dydžio atžvilgiu */
				width: 100%;
				height: 100%;

				animation: slide 9s infinite;
			}

			/* SLIDE */
			.carousel .slide {
				width: 100%;
				height: 100%;
				flex-shrink: 0;
				background-size: cover;
				background-position: center;
				position: relative;
			}

			/* CONTENT */
			.carousel .content {
				position: absolute;
				right: 60px;
				top: 50%;
				transform: translateY(-50%);
				color: white;
				max-width: 420px;
			}

			.carousel .content p {
				color: #ffd966;
				margin-bottom: 10px;
			}

			.carousel .content h2 {
				font-size: 40px;
				margin-bottom: 20px;
			}

			.carousel .content button {
				padding: 12px 24px;
				background: #6aa84f;
				border: none;
				color: white;
				border-radius: 6px;
				font-size: 16px;
				cursor: pointer;
			}

			/* BACKGROUNDS */
			.carousel .slide-1 {
				background-image: url("./images/01.webp");
			}

			.carousel .slide-2 {
				background-image: url("./images/08.webp");
			}

			/* ANIMATION */
			@keyframes slide {
				0% {
					transform: translateX(0);
				}
				40% {
					transform: translateX(0);
				}

				50% {
					transform: translateX(-100%);
				}

				90% {
					transform: translateX(-100%);
				}

				100% {
					transform: translateX(0);
				}
			}
		</style>
	</head>

	<body>
		<div class="carousel">
			<div class="slides">
				<div class="slide slide-1">
					<div class="content">
						<p>Up to 30% off</p>
						<h2>Fresh Grocery Deals</h2>
						<button>Shop Now →</button>
					</div>
				</div>

				<div class="slide slide-2">
					<div class="content">
						<p>Organic & Healthy</p>
						<h2>Best Quality Products</h2>
						<button>Shop Now →</button>
					</div>
				</div>
			</div>
		</div>
	</body>
</html>
