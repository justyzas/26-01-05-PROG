<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Flex</title>
		<style>
			.container {
				height: 600px;
				border: 2px solid orangered;

				display: flex;

				/* Flex wrap - padaro, kad būtų galima dirbti su keliomis eilutėmis flex'e () */
				flex-wrap: wrap;

				/* Nurodo rikiavimo pobūdį, pagal default naudojamas row
			             row, row-reverse, column, column-reverse
			             */
				flex-direction: column;

				/* Align items - vertikalus poz. */
				/* start, center, end */
				align-items: center;
				/* Justify-content - horizontalus poz. */
				/* start, center, end, space-between, space-around */
				justify-content: space-between;

				/* Naudojant flex arba grid, veikia tarpavimas tarp elementų */
				/* gap: 20px; */
				column-gap: 10px;
				row-gap: 20px;
			}

			.box {
				padding: 48px;
				max-width: 100px;
				max-height: 100px;
				background-color: aquamarine;
				border: 1px solid blue;
				text-align: center;
			}
		</style>
	</head>
	<body>
		<div class="container">
			<div class="box">1</div>
			<div class="box">2</div>
			<div class="box">3</div>
			<div class="box">1</div>
			<div class="box">2</div>
			<div class="box">3</div>
			<div class="box">1</div>
			<div class="box">2</div>
			<div class="box">3</div>
		</div>
	</body>
</html>
