<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0"
		/>
		<title>Document</title>
		<style>
			.categories-btn {
				background: #6aa84f;
				color: #fff;
				border: none;
				/* Vidinė paraštė */
				padding: 14px 20px;
				font-size: 14px;
				cursor: pointer;
				/* Kampų užapvalinimas */
				border-radius: 5px;
			}
			.categories:hover .categories-menu {
				display: block;
			}
			.categories-menu {
				position: absolute;
				top: 100%;
				left: 0;
				width: 180px;
				background: #fff;
				border-radius: 6px;
				/* border: 2px solid red; */
				/*  */
				box-shadow: 0 15px 30px rgba(0, 0, 0, 0.15);
				list-style: none;
				padding: 10px 0;
				margin: 0;
				/* none - padaro, kad elemento nebūtų */
				display: none;

				/* Ši savybė padaro kad tekstas būtų nepažymimas */
				user-select: none;
			}

			.categories {
				position: relative;
				display: inline-block;
			}

			.item {
				display: flex;
				align-items: center;
				gap: 10px;
				cursor: pointer;
			}
			.icon {
				width: 22px;
				height: 22px;
				border-radius: 50%;
				background: #e0e0e0;
				display: flex;
				align-items: center;
				justify-content: center;
				font-size: 12px;
			}

			.categories-menu li:hover {
				background: #f2f2f2;
			}
		</style>
	</head>
	<body>
		<div class="categories">
			<button class="categories-btn">☰ Categories</button>

			<ul class="categories-menu">
				<li>
					<div class="item">
						<div class="icon">🥛</div>
						<span>Breakfast & Dairy</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">🥩</div>
						<span>Meats & Seafood</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">🍞</div>
						<span>Breads & Bakery</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">🍪</div>
						<span>Chips & Snacks</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">💊</div>
						<span>Medical Healthcare</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">❄️</div>
						<span>Frozen Foods</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">🛒</div>
						<span>Grocery & Staples</span>
					</div>
				</li>

				<li>
					<div class="item">
						<div class="icon">📦</div>
						<span>Other Items</span>
					</div>
				</li>
			</ul>
		</div>
	</body>
</html>
